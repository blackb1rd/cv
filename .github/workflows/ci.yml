name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    name: Build CV
    runs-on: ubuntu-latest
    steps:
      - name: Git checkout
        uses: actions/checkout@v7
      - name: Compile
        run: docker build --pull --output build .
      - name: Archive CV artifacts
        uses: actions/upload-artifact@v7
        with:
          name: cv
          path: |
            build/*.pdf
